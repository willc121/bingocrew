name: Supabase Keepalive

on:
  schedule:
    # Runs daily at 8:00 AM UTC to prevent Supabase 7-day auto-pause
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

# Needed so the heartbeat step can push a commit back to the repo.
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ping Supabase to keep alive
        run: |
          # Install only a pinned pg into a scratch dir. Running npm in the repo
          # root pulled the app's full dependency tree, and an unpinned
          # @supabase/supabase-js broke the ping when a new release was
          # published mid-run (ETARGET on @supabase/auth-js).
          mkdir -p "$RUNNER_TEMP/keepalive" && cd "$RUNNER_TEMP/keepalive"
          echo '{ "private": true }' > package.json
          npm install --no-audit --no-fund --ignore-scripts pg@8.23.0

          node -e "
          const { Client } = require('pg');

          (async () => {
            let pgSuccess = false;

            // Method 1: Direct Postgres connection (most reliable for activity detection)
            if (process.env.DATABASE_URL) {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              try {
                await client.connect();
                const res = await client.query('SELECT now() AS time');
                console.log('✅ Direct Postgres ping succeeded at', res.rows[0].time);
                pgSuccess = true;
              } catch (err) {
                console.log('⚠️ Postgres connection failed:', err.message);
              } finally {
                try { await client.end(); } catch {}
              }
            } else {
              console.log('⚠️ DATABASE_URL not set, skipping direct Postgres');
            }

            // Method 2: Supabase REST API fallback (same request supabase-js makes)
            if (process.env.SUPABASE_URL && process.env.SUPABASE_ANON_KEY) {
              const key = process.env.SUPABASE_ANON_KEY;
              const base = process.env.SUPABASE_URL.endsWith('/') ? process.env.SUPABASE_URL : process.env.SUPABASE_URL + '/';
              try {
                const res = await fetch(new URL('rest/v1/cards?select=id&limit=1', base), {
                  headers: { apikey: key, Authorization: 'Bearer ' + key },
                });
                const body = await res.json().catch(() => null);
                if (!res.ok) {
                  console.log('⚠️ REST API query error:', (body && body.message) || res.status + ' ' + res.statusText);
                } else {
                  console.log('✅ REST API ping succeeded, rows:', body.length);
                }
              } catch (err) {
                console.log('⚠️ REST API query error:', err.message);
              }
            }

            if (!pgSuccess) {
              console.log('⚠️ Direct Postgres failed - REST API was used as fallback.');
              console.log('   To fix: ensure DATABASE_URL secret has the correct Session Pooler connection string.');
              process.exit(1);
            }

            console.log('✅ Supabase keepalive complete');
          })();
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Keep repository active (prevent scheduled-workflow auto-disable)
        # Runs regardless of the Supabase ping result so the workflow can never
        # disable itself just because the database is temporarily unreachable.
        if: always()
        run: |
          # GitHub auto-disables scheduled workflows after 60 days of repo
          # inactivity. A scheduled run does NOT count as activity, so we push a
          # tiny heartbeat commit when the last commit is >= 45 days old. That
          # resets the 60-day timer with a comfortable safety margin while
          # keeping commit noise low (~8 commits/year instead of one per day).
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date -u +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
          echo "Days since last commit: $DAYS_SINCE"

          if [ "$DAYS_SINCE" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
            git add .github/last-keepalive.txt
            git commit -m "chore: keepalive heartbeat to prevent workflow auto-disable [skip ci]"
            git push
            echo "✅ Pushed heartbeat commit (repo inactivity timer reset)"
          else
            echo "ℹ️ Repo last active $DAYS_SINCE days ago (< 45); no heartbeat needed"
          fi
